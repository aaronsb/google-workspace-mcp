tool_name: manage_docs
description: "Read, write, insert, and find-replace text in Google Docs documents."
requires_email: true
google_service: docs
operations:

  # A document's text lives per-TAB, and `tabId` is the handle that addresses one — the
  # same handle every write operation below takes. Reading without it spans the document;
  # reading with it scopes both the text and the character indices to one tab, so an
  # index measured here means the same thing to insertText (#157, #158).
  get:
    type: detail
    description: "get document content and metadata"
    resource: documents.get
    params:
      documentId:
        type: string
        description: "Document ID"
        required: true
      tabId:
        type: string
        description: "Tab to act on — a tabId from a previous get's tabIndex. Scopes the read on get; targets the edit on write/insertText/replaceText, which act on the FIRST tab when it is omitted (replaceText spans every tab). Character indices are per-tab."

  # `title` rides in the BODY — documents.create declares no parameters at all
  # (Discovery: `"parameters": {}`), so everything goes into the Document resource.
  # Without this the tool could only ever produce documents called "Untitled document",
  # and a caller passing a title got no error — the argument was simply not in the
  # schema, so it was dropped in silence. manage_sheets.create has always taken one.
  create:
    type: action
    description: "create a new document"
    resource: documents.create
    params:
      title:
        type: string
        description: "Document title (default: 'Untitled document')"

  # One documents.batchUpdate with a single insertText at endOfSegmentLocation —
  # append to end of body. It needs a request body, so it is a custom handler
  # rather than a bare resource op (docsPatch.write).
  write:
    type: action
    description: "append text to the end of a document"
    resource: documents.batchUpdate
    params:
      documentId:
        type: string
        description: "Document ID"
        required: true
      text:
        type: string
        description: "Text to write (plain text) — appended to the end by write, inserted at `index` by insertText"
        required: true
      tabId:
        type: string
        description: "Tab to act on — a tabId from a previous get's tabIndex. Scopes the read on get; targets the edit on write/insertText/replaceText, which act on the FIRST tab when it is omitted (replaceText spans every tab). Character indices are per-tab."

  insertText:
    type: action
    description: "insert text at a specific position in a document"
    resource: documents.batchUpdate
    params:
      documentId:
        type: string
        description: "Document ID"
        required: true
      text:
        type: string
        description: "Text to write (plain text) — appended to the end by write, inserted at `index` by insertText"
        required: true
      index:
        type: number
        description: "Character index to insert at (1 = start of the tab's body)"
        required: true
      tabId:
        type: string
        description: "Tab to act on — a tabId from a previous get's tabIndex. Scopes the read on get; targets the edit on write/insertText/replaceText, which act on the FIRST tab when it is omitted (replaceText spans every tab). Character indices are per-tab."

  replaceText:
    type: action
    description: "find and replace text in a document"
    resource: documents.batchUpdate
    params:
      documentId:
        type: string
        description: "Document ID"
        required: true
      findText:
        type: string
        description: "Text to find"
        required: true
      replaceWith:
        type: string
        description: "Replacement text"
        required: true
      matchCase:
        type: boolean
        description: "Case-sensitive match (default: true)"
        default: true
      tabId:
        type: string
        description: "Tab to act on — a tabId from a previous get's tabIndex. Scopes the read on get; targets the edit on write/insertText/replaceText, which act on the FIRST tab when it is omitted (replaceText spans every tab). Character indices are per-tab."
