tool_name: manage_calendar
description: "List events, view agenda, check availability, or manage calendar events."
requires_email: true
google_service: calendar
operations:

  # --- Event viewing ---

  list:
    type: list
    description: "upcoming events — defaults to primary calendar, use calendarId to target a specific calendar (use 'calendars' operation to discover IDs)"
    resource: events.list
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      timeMin:
        type: string
        description: "Start of range (ISO 8601). On `list`, defaults to today."
      timeMax:
        type: string
        description: "End of range (ISO 8601)"
      maxResults:
        type: number
        description: "Max events (default: 10, max: 50)"
        default: 10
        max: 50
      query:
        type: string
        description: "Free-text search terms to filter events"
        maps_to: q
    defaults:
      calendarId: primary
      singleEvents: true
      orderBy: startTime

  agenda:
    type: list
    description: "today's schedule at a glance (all calendars). Returns calendarId per event for follow-up get calls."
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      days:
        type: number
        description: "Number of days ahead to show (default: today only)"
      tomorrow:
        type: boolean
        description: "Show tomorrow's events instead of today"
      week:
        type: boolean
        description: "Show this week's events"

  get:
    type: detail
    description: "full event details by ID. For shared calendar events, calendarId is required (use agenda or list to discover it)."
    resource: events.get
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      eventId:
        type: string
        description: "Event ID"
        required: true
    defaults:
      calendarId: primary

  # --- Event management ---

  create:
    type: action
    description: "create a new calendar event"
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      summary:
        type: string
        description: "Event title"
        required: true
      start:
        type: string
        description: "Start time (ISO 8601) — or a DATE (YYYY-MM-DD) when allDay is true"
        required: true
      end:
        type: string
        description: "End time (ISO 8601) — or, when allDay is true, a DATE (YYYY-MM-DD) that is the INCLUSIVE last day; the exclusive end date the Calendar API requires is computed for you. Optional for all-day events: a missing end (or one equal to start) makes a one-day event."
      allDay:
        type: boolean
        description: "Whether the event is all-day. When true, start and end are DATES (YYYY-MM-DD — an ISO datetime's date part is used) and end, if given, is the INCLUSIVE last day; the exclusive end date the Calendar API requires is computed for you. Omit it (or pass false) for a timed event with start/end as dateTime — pass false with new datetimes to convert an all-day event back to a timed one."
      description:
        type: string
        description: "Event description or notes"
      location:
        type: string
        description: "Event location"
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update`, whatever you pass REPLACES the existing list — addresses you leave out are removed, and an empty string clears everyone. OMIT the parameter to leave the attendee list untouched while changing other fields. On `freebusy`, the addresses whose availability to check."
      meet:
        type: boolean
        description: "Add a Google Meet video conference link. On `update`, true adds a link and false REMOVES an existing one; omit it to leave the link as it is."

  quickAdd:
    type: action
    description: "create event from natural language (e.g. 'Lunch with Alice tomorrow at noon')"
    resource: events.quickAdd
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      text:
        type: string
        description: "Natural language event description"
        required: true
    defaults:
      calendarId: primary

  update:
    type: action
    description: "update an existing event (patch semantics — only changed fields needed)"
    resource: events.patch
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      eventId:
        type: string
        description: "Event ID"
        required: true
      summary:
        type: string
        description: "Event title"
      start:
        type: string
        description: "Start time (ISO 8601) — or a DATE (YYYY-MM-DD) when allDay is true"
      end:
        type: string
        description: "End time (ISO 8601) — or, when allDay is true, a DATE (YYYY-MM-DD) that is the INCLUSIVE last day; the exclusive end date the Calendar API requires is computed for you. Optional for all-day events: a missing end (or one equal to start) makes a one-day event."
      allDay:
        type: boolean
        description: "Whether the event is all-day. When true, start and end are DATES (YYYY-MM-DD — an ISO datetime's date part is used) and end, if given, is the INCLUSIVE last day; the exclusive end date the Calendar API requires is computed for you. Omit it (or pass false) for a timed event with start/end as dateTime — pass false with new datetimes to convert an all-day event back to a timed one."
      description:
        type: string
        description: "Event description or notes"
      location:
        type: string
        description: "Event location"
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update`, whatever you pass REPLACES the existing list — addresses you leave out are removed, and an empty string clears everyone. OMIT the parameter to leave the attendee list untouched while changing other fields. On `freebusy`, the addresses whose availability to check."
      meet:
        type: boolean
        description: "Add a Google Meet video conference link. On `update`, true adds a link and false REMOVES an existing one; omit it to leave the link as it is."
    defaults:
      calendarId: primary

  delete:
    type: action
    description: "delete an event"
    resource: events.delete
    params:
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
      eventId:
        type: string
        description: "Event ID"
        required: true
    defaults:
      calendarId: primary

  # --- Calendar management ---

  calendars:
    type: list
    description: "list all calendars the user has access to"
    resource: calendarList.list

  freebusy:
    type: detail
    description: "check availability (free/busy) for a time range. Automatically includes own calendar; add attendees to check others."
    resource: freebusy.query
    params:
      timeMin:
        type: string
        description: "Start of range (ISO 8601). On `list`, defaults to today."
        required: true
      timeMax:
        type: string
        description: "End of range (ISO 8601)"
        required: true
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update`, whatever you pass REPLACES the existing list — addresses you leave out are removed, and an empty string clears everyone. OMIT the parameter to leave the attendee list untouched while changing other fields. On `freebusy`, the addresses whose availability to check."
      calendarId:
        type: string
        description: "Calendar ID. Use the `calendars` operation to list available IDs; required for events on shared calendars. Defaults to 'primary' on the event operations (`list`, `get`, `create`, `quickAdd`, `update`, `delete`). On `agenda`, a calendar name or ID to filter to — OMIT it to span all calendars, and do not pass 'primary', which is an API alias rather than an id agenda matches on. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own."
