tool_name: manage_calendar
description: "List events, view agenda, check availability, or manage calendar events."
requires_email: true
google_service: calendar
operations:

  # --- Event viewing ---

  list:
    type: list
    description: "upcoming events — defaults to primary calendar, use calendarId to target a specific calendar (use 'calendars' operation to discover IDs)"
    resource: events.list
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      timeMin:
        type: string
        description: "Start of range (ISO 8601). On `list`, defaults to today."
      timeMax:
        type: string
        description: "End of range (ISO 8601)"
      maxResults:
        type: number
        description: "Max events (default: 10, max: 50)"
        default: 10
        max: 50
      query:
        type: string
        description: "Free-text search terms to filter events"
        maps_to: q
    defaults:
      calendarId: primary
      singleEvents: true
      orderBy: startTime

  agenda:
    type: list
    description: "today's schedule at a glance (all calendars). Returns calendarId per event for follow-up get calls."
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      days:
        type: number
        description: "Number of days ahead to show (default: today only)"
      tomorrow:
        type: boolean
        description: "Show tomorrow's events instead of today"
      week:
        type: boolean
        description: "Show this week's events"

  get:
    type: detail
    description: "full event details by ID. For shared calendar events, calendarId is required (use agenda or list to discover it)."
    resource: events.get
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      eventId:
        type: string
        description: "Event ID"
        required: true
    defaults:
      calendarId: primary

  # --- Event management ---

  create:
    type: action
    description: "create a new calendar event"
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      summary:
        type: string
        description: "Event title"
        required: true
      start:
        type: string
        description: "Start time (ISO 8601)"
        required: true
      end:
        type: string
        description: "End time (ISO 8601)"
        required: true
      description:
        type: string
        description: "Event description or notes"
      location:
        type: string
        description: "Event location"
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update` this REPLACES the entire attendee list (Google's events.patch overwrites arrays) — pass an empty string to clear all attendees. On `freebusy`, the addresses whose availability to check."
      meet:
        type: boolean
        description: "Add a Google Meet video conference link to the event. Google does NOT allow removing an existing link via `update` — omit it or set false to leave the link untouched."

  quickAdd:
    type: action
    description: "create event from natural language (e.g. 'Lunch with Alice tomorrow at noon')"
    resource: events.quickAdd
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      text:
        type: string
        description: "Natural language event description"
        required: true
    defaults:
      calendarId: primary

  update:
    type: action
    description: "update an existing event (patch semantics — only changed fields needed)"
    resource: events.patch
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      eventId:
        type: string
        description: "Event ID"
        required: true
      summary:
        type: string
        description: "Event title"
      start:
        type: string
        description: "Start time (ISO 8601)"
      end:
        type: string
        description: "End time (ISO 8601)"
      description:
        type: string
        description: "Event description or notes"
      location:
        type: string
        description: "Event location"
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update` this REPLACES the entire attendee list (Google's events.patch overwrites arrays) — pass an empty string to clear all attendees. On `freebusy`, the addresses whose availability to check."
      meet:
        type: boolean
        description: "Add a Google Meet video conference link to the event. Google does NOT allow removing an existing link via `update` — omit it or set false to leave the link untouched."
    defaults:
      calendarId: primary

  delete:
    type: action
    description: "delete an event"
    resource: events.delete
    params:
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
      eventId:
        type: string
        description: "Event ID"
        required: true
    defaults:
      calendarId: primary

  # --- Calendar management ---

  calendars:
    type: list
    description: "list all calendars the user has access to"
    resource: calendarList.list

  freebusy:
    type: detail
    description: "check availability (free/busy) for a time range. Automatically includes own calendar; add attendees to check others."
    resource: freebusy.query
    params:
      timeMin:
        type: string
        description: "Start of range (ISO 8601). On `list`, defaults to today."
        required: true
      timeMax:
        type: string
        description: "End of range (ISO 8601)"
        required: true
      attendees:
        type: string
        description: "Comma-separated email addresses. On `update` this REPLACES the entire attendee list (Google's events.patch overwrites arrays) — pass an empty string to clear all attendees. On `freebusy`, the addresses whose availability to check."
      calendarId:
        type: string
        description: "Calendar ID (default: 'primary'). Use the `calendars` operation to list available IDs; required for events on shared calendars. On `freebusy`, a comma-separated list of calendar IDs to check IN ADDITION to your own. On `agenda`, a calendar name or ID to filter to."
