# ADR Configuration — google-workspace-mcp
# Defines domain numbering and validation rules.
# Used by: docs/scripts/adr

project_name: Google Workspace MCP Server

domains:
  core:
    range: [100, 199]
    name: Core
    description: Architecture, tool design, executor patterns
    folder: core

  auth:
    range: [200, 299]
    name: Authentication
    description: OAuth, credential management, multi-account
    folder: auth

  api:
    range: [300, 399]
    name: API Surface
    description: MCP tools, schemas, progressive disclosure
    folder: api

statuses:
  - Draft
  - Proposed
  - Accepted
  - Superseded
  - Deprecated

defaults:
  deciders: [aaronsb]
  status: Draft

legacy:
  range: [1, 99]
  label: "Legacy"

viewer: cat {file}

# The record contract (ADR-304). With `contract: adr/v1`, records are typed:
# each declares a kind, and a decision names a verb, a capability and its
# basis. Delete this line and the v1 blocks below to stay on adr/v0.
contract: adr/v1

kinds:
  decision:
    verb: required
    requires: [capability, basis, agent]
    sections: [Summary]
    edges: { supersedes: decision, amends: decision, extends: decision, basis: [decision, spec, evidence] }
  spec:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: spec, decided_by: decision }
  evidence:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: evidence }

# What the project does, one line each. A record's `capability` names one of
# these, and a decision adds, cuts, changes or constrains them.
# Domains (core, auth, api) allocate record numbers and folders; these
# capabilities say what a decision changes, independent of its folder.
capabilities:
  client: The generated Google API descriptor and the single client every request passes through
  factory: Manifest-driven tool generation, schemas and response framing
  accounts: OAuth flow, credentials and per-account access
  safety: Policies and guards that refuse, preview or narrow an operation before it reaches Google
  bulk: Queue and batch operations, including server-held operation sets
  scratchpad: The content authoring buffer, its formats and adapters
  services: Per-service tool surfaces such as Gmail, Docs and Contacts
  runtime: Process lifecycle and the supported Node runtime
  process: Conventions, documentation and the development process that belong to no product capability
  adr: Decision records, their contract and the adr tool
